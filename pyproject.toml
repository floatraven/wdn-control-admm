[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wdn-admm"
version = "0.1.0"
description = "Distributed nonconvex optimisation for control of water networks with time-coupling constraints (Python port)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "casadi>=3.6",
    "osqp>=0.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wdn-admm = "wdn_admm.cli:main"

[tool.setuptools]
packages = ["wdn_admm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so a bare `pytest` works from a fresh
# clone, without needing `pip install -e .` or `python -m pytest`.
pythonpath = ["."]
markers = ["slow: needs a full optimisation solve (enable with --run-slow)"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
